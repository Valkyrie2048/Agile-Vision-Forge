  <text x="66" y="552" font-size="15" fill="rgba(255,255,255,0.62)" font-style="italic">The hard problem is not whether machines can think.</text>
  <text x="66" y="574" font-size="15" fill="rgba(255,255,255,0.62)" font-style="italic">It is whether they can experience anything at all.</text>
