  <!-- Filter tags row -->
  <g font-family="system-ui,sans-serif" font-size="11" font-weight="500">
    <!-- ALL - active -->
    <rect x="96" y="342" width="44" height="28" rx="4" fill="#C9A84C"/>
    <text x="118" y="361" fill="#060912" font-weight="700" letter-spacing="0.5" text-anchor="middle">ALL</text>
    <!-- Other tags -->
    <rect x="152" y="342" width="186" height="28" rx="4" fill="none" stroke="#C9A84C" stroke-opacity="0.35" stroke-width="1"/>
    <text x="245" y="361" fill="#C9A84C" letter-spacing="0.8" text-anchor="middle">ATTENTION &amp; COGNITION</text>
    <rect x="350" y="342" width="180" height="28" rx="4" fill="none" stroke="#C9A84C" stroke-opacity="0.35" stroke-width="1"/>
    <text x="440" y="361" fill="#C9A84C" letter-spacing="0.8" text-anchor="middle">AGENCY &amp; AUTONOMY</text>
    <rect x="542" y="342" width="186" height="28" rx="4" fill="none" stroke="#C9A84C" stroke-opacity="0.35" stroke-width="1"/>
    <text x="635" y="361" fill="#C9A84C" letter-spacing="0.8" text-anchor="middle">HUMAN FLOURISHING</text>
    <rect x="740" y="342" width="170" height="28" rx="4" fill="none" stroke="#C9A84C" stroke-opacity="0.35" stroke-width="1"/>
    <text x="825" y="361" fill="#C9A84C" letter-spacing="0.8" text-anchor="middle">PHILOSOPHY OF MIND</text>
    <rect x="922" y="342" width="155" height="28" rx="4" fill="none" stroke="#C9A84C" stroke-opacity="0.35" stroke-width="1"/>
    <text x="999" y="361" fill="#C9A84C" letter-spacing="0.8" text-anchor="middle">WORK &amp; SOCIETY</text>
    <rect x="1089" y="342" width="168" height="28" rx="4" fill="none" stroke="#C9A84C" stroke-opacity="0.35" stroke-width="1"/>
    <text x="1173" y="361" fill="#C9A84C" letter-spacing="0.8" text-anchor="middle">MEMORY &amp; IDENTITY</text>
    <!-- Search -->
    <rect x="1350" y="342" width="214" height="28" rx="4" fill="none" stroke="#4A5160" stroke-width="1"/>
    <text x="1370" y="361" fill="#4A5160" font-size="12">🔍</text>
    <text x="1390" y="361" fill="#4A5160">Search essays...</text>
  </g>

  <!-- Essay cards - row 1 -->
  <!-- Card 1 -->
  <rect x="96" y="398" width="718" height="460" rx="4" fill="#0E1220"/>
  <!-- Image area -->
  <rect x="96" y="398" width="718" height="285" rx="4" fill="#141A2E"/>
  <!-- Abstract image content - attention/brain visualization -->
  <ellipse cx="455" cy="540" rx="180" ry="90" fill="#1E2845" opacity="0.8"/>
  <g stroke="#C9A84C" stroke-width="0.6" opacity="0.2">
    <line x1="280" y1="450" x2="455" y2="540"/><line x1="630" y1="450" x2="455" y2="540"/>
    <line x1="455" y1="398" x2="455" y2="540"/><line x1="455" y1="540" x2="455" y2="683"/>
    <line x1="350" y1="480" x2="560" y2="600"/>
  </g>
  <circle cx="455" cy="540" r="60" fill="none" stroke="#C9A84C" stroke-opacity="0.15" stroke-width="30"/>
  <circle cx="455" cy="540" r="8" fill="#C9A84C" opacity="0.6"/>
  <circle cx="310" cy="465" r="4" fill="#C9A84C" opacity="0.4"/>
  <circle cx="600" cy="465" r="4" fill="#C9A84C" opacity="0.4"/>
  <circle cx="370" cy="620" r="3" fill="#C9A84C" opacity="0.3"/>
  <circle cx="540" cy="610" r="3" fill="#C9A84C" opacity="0.3"/>
  <!-- Category badge -->
  <rect x="112" y="414" width="176" height="24" rx="3" fill="#C9A84C" fill-opacity="0.15" stroke="#C9A84C" stroke-opacity="0.4" stroke-width="1"/>
  <text x="200" y="431" font-family="system-ui,sans-serif" font-size="10" fill="#C9A84C" font-weight="600" letter-spacing="1.2" text-anchor="middle">ATTENTION &amp; COGNITION</text>
  <!-- Card text -->
  <text x="112" y="714" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#EDE8DC" font-weight="400">The Attention Economy and</text>
  <text x="112" y="746" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#EDE8DC" font-weight="400">the Fragmented Mind</text>
  <text x="112" y="776" font-family="system-ui,sans-serif" font-size="14" fill="#7A8290">Algorithmic systems are designed to capture and hold</text>
  <text x="112" y="794" font-family="system-ui,sans-serif" font-size="14" fill="#7A8290">attention — but at what cost to our capacity for sustained</text>
  <text x="112" y="812" font-family="system-ui,sans-serif" font-size="14" fill="#7A8290">thought, deep reading, and deliberate action?</text>
  <text x="112" y="842" font-family="system-ui,sans-serif" font-size="12" fill="#C9A84C">Read more →</text>

  <!-- Card 2 -->
  <rect x="830" y="398" width="718" height="460" rx="4" fill="#0E1220"/>
  <rect x="830" y="398" width="718" height="285" rx="4" fill="#141A2E"/>
  <!-- Abstract image - person in tunnel/spiral -->
  <ellipse cx="1189" cy="540" rx="85" ry="85" fill="#1A2235"/>
  <circle cx="1189" cy="540" r="75" fill="none" stroke="#C9A84C" stroke-opacity="0.08" stroke-width="1"/>
  <circle cx="1189" cy="540" r="55" fill="none" stroke="#C9A84C" stroke-opacity="0.1" stroke-width="1"/>
  <circle cx="1189" cy="540" r="38" fill="none" stroke="#C9A84C" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="1189" cy="540" r="20" fill="none" stroke="#C9A84C" stroke-opacity="0.2" stroke-width="2"/>
  <ellipse cx="1189" cy="525" rx="6" ry="12" fill="#C9A84C" opacity="0.5"/>
  <ellipse cx="1189" cy="555" rx="10" ry="6" fill="#C9A84C" opacity="0.2"/>
  <g stroke="#C9A84C" stroke-width="0.5" opacity="0.15">
    <line x1="830" y1="460" x2="1100" y2="540"/><line x1="1480" y1="460" x2="1278" y2="540"/>
    <line x1="1189" y1="398" x2="1189" y2="465"/><line x1="1189" y1="615" x2="1189" y2="683"/>
  </g>
  <!-- Category badge -->
  <rect x="846" y="414" width="164" height="24" rx="3" fill="#C9A84C" fill-opacity="0.15" stroke="#C9A84C" stroke-opacity="0.4" stroke-width="1"/>
  <text x="928" y="431" font-family="system-ui,sans-serif" font-size="10" fill="#C9A84C" font-weight="600" letter-spacing="1.2" text-anchor="middle">AGENCY &amp; AUTONOMY</text>
  <!-- Card text -->
  <text x="846" y="714" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#EDE8DC" font-weight="400">Cognitive Sovereignty in the</text>
  <text x="846" y="746" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#EDE8DC" font-weight="400">Age of Algorithmic Persuasion</text>
  <text x="846" y="776" font-family="system-ui,sans-serif" font-size="14" fill="#7A8290">As AI systems grow more capable of shaping belief and</text>
  <text x="846" y="794" font-family="system-ui,sans-serif" font-size="14" fill="#7A8290">behavior, what does it mean to think, choose, and form</text>
  <text x="846" y="812" font-family="system-ui,sans-serif" font-size="14" fill="#7A8290">convictions that are genuinely one's own?</text>
  <text x="846" y="842" font-family="system-ui,sans-serif" font-size="12" fill="#C9A84C">Read more →</text>
</svg>
