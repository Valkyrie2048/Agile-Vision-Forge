  <!-- Title -->
  <text x="50" y="206" font-size="32" font-weight="700" fill="rgba(255,255,255,0.88)" letter-spacing="-0.8">The Question of Machine</text>
  <text x="50" y="246" font-size="32" font-weight="700" fill="rgba(255,255,255,0.88)" letter-spacing="-0.8">Consciousness</text>
  <!-- Subtitle -->
  <text x="50" y="280" font-size="15" fill="rgba(255,255,255,0.4)" font-style="italic">How should we think about experience in systems that process information?</text>
