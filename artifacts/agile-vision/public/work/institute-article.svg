<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg-th" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1A"/><stop offset="100%" stop-color="#070C14"/>
    </linearGradient>
    <linearGradient id="gold-th" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A84C"/><stop offset="100%" stop-color="#E2C97E"/>
    </linearGradient>
    <filter id="tag-shadow"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#C9A84C" flood-opacity="0.2"/></filter>
  </defs>

  <!-- Browser chrome -->
  <rect width="1600" height="900" rx="8" fill="#1C1C1E"/>
  <rect x="0" y="0" width="1600" height="42" rx="8" fill="#2A2A2D"/>
  <rect x="0" y="30" width="1600" height="12" fill="#2A2A2D"/>
  <circle cx="24" cy="21" r="6" fill="#FF5F57"/><circle cx="44" cy="21" r="6" fill="#FEBC2E"/><circle cx="64" cy="21" r="6" fill="#28C840"/>
  <rect x="200" y="11" width="840" height="20" rx="5" fill="#3A3A3D"/>
  <text x="620" y="25" font-family="system-ui,sans-serif" font-size="11" fill="#8A8A8E" text-anchor="middle">futureofconsciousness.global/thinking</text>

  <!-- Site bg -->
  <rect x="0" y="42" width="1600" height="858" fill="url(#bg-th)"/>

  <!-- Nav -->
  <g font-family="system-ui,-apple-system,sans-serif">
    <text x="96" y="88" font-size="12" fill="#F0EBE0">The Institute for AI</text>
    <text x="96" y="103" font-size="12" fill="#F0EBE0">and the Future of Consciousness</text>
    <text x="542" y="95" font-size="10" fill="#9BA3AF" letter-spacing="1.5">ABOUT</text>
    <text x="603" y="95" font-size="10" fill="#C9A84C" letter-spacing="1.5" font-weight="600">THINKING</text>
    <text x="694" y="95" font-size="10" fill="#9BA3AF" letter-spacing="1.5">OP-EDS</text>
    <text x="756" y="95" font-size="10" fill="#9BA3AF" letter-spacing="1.5">DISPATCH</text>
    <text x="830" y="95" font-size="10" fill="#9BA3AF" letter-spacing="1.5">ENGAGE</text>
    <line x1="903" y1="82" x2="903" y2="107" stroke="#9BA3AF" stroke-opacity="0.3" stroke-width="0.8"/>
    <text x="916" y="95" font-size="10" fill="#9BA3AF" letter-spacing="1.5">AUDIENCES</text>
    <rect x="1090" y="78" width="148" height="25" fill="none" stroke="#C9A84C" stroke-width="1" rx="2"/>
    <text x="1164" y="95" font-size="9" fill="#C9A84C" font-weight="600" letter-spacing="1" text-anchor="middle">BECOME A PARTNER</text>
    <rect x="1250" y="78" width="108" height="25" fill="none" stroke="#C9A84C" stroke-width="1" rx="2"/>
    <text x="1304" y="95" font-size="9" fill="#C9A84C" font-weight="600" letter-spacing="1" text-anchor="middle">GET INVOLVED</text>
    <rect x="1370" y="78" width="100" height="25" fill="url(#gold-th)" rx="2"/>
    <text x="1420" y="95" font-size="9" fill="#060912" font-weight="700" letter-spacing="1" text-anchor="middle">DONATE NOW</text>
  </g>
  <line x1="96" y1="118" x2="1520" y2="118" stroke="#C9A84C" stroke-opacity="0.12" stroke-width="0.5"/>

  <!-- Page header -->
  <text x="96" y="165" font-family="system-ui,sans-serif" font-size="11" fill="#C9A84C" letter-spacing="2.5" font-weight="500">FROM THE INSTITUTE</text>
  <text x="96" y="240" font-family="Georgia,'Times New Roman',serif" font-size="80" fill="#EDE8DC" font-weight="400" letter-spacing="-1">Thinking</text>
  <text x="96" y="278" font-family="system-ui,sans-serif" font-size="17" fill="#7A8290">Essays, analyses, and perspectives on AI and the human condition —</text>
  <text x="96" y="298" font-family="system-ui,sans-serif" font-size="17" fill="#7A8290">written for anyone who cares how this story ends.</text>

  <!-- Divider -->
