<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 860" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="55%"><stop offset="0%" stop-color="#2B8CEE" stop-opacity="0.12"/><stop offset="100%" stop-color="#2B8CEE" stop-opacity="0"/></radialGradient>
    <linearGradient id="cf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2B8CEE" stop-opacity="0.28"/><stop offset="100%" stop-color="#2B8CEE" stop-opacity="0.02"/></linearGradient>
  </defs>
  <rect width="500" height="860" fill="#060610"/>
  <rect width="500" height="860" fill="url(#bg)"/>
  <!-- Phone frame -->
  <rect x="20" y="20" width="460" height="820" rx="44" fill="#0e0c20" stroke="rgba(255,255,255,0.09)" stroke-width="2"/>
  <rect x="26" y="26" width="448" height="808" rx="40" fill="#070612"/>
  <!-- Notch -->
  <rect x="172" y="28" width="156" height="30" rx="15" fill="#0e0c20"/>
  <!-- Status bar -->
  <text x="50" y="48" font-size="11" fill="rgba(255,255,255,0.5)">9:41</text>
  <text x="450" y="48" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="end">&#x25A6; 100%</text>
  <!-- Header -->
  <rect x="26" y="56" width="448" height="80" fill="rgba(7,6,18,0.8)"/>
  <text x="250" y="88" font-size="14" font-weight="800" fill="#2B8CEE" font-style="italic" text-anchor="middle">GIGAMATIC Finance</text>
  <text x="250" y="108" font-size="11" fill="rgba(255,255,255,0.32)" text-anchor="middle">Weekly overview</text>
  <rect x="26" y="136" width="448" height="1" fill="rgba(255,255,255,0.05)"/>
  <!-- Week selector -->
  <text x="80" y="164" font-size="13" fill="rgba(255,255,255,0.25)">&#x276E;</text>
  <text x="250" y="166" font-size="13" font-weight="600" fill="rgba(255,255,255,0.7)" text-anchor="middle">July 7&#x2013;14, 2026</text>
  <text x="420" y="164" font-size="13" fill="rgba(255,255,255,0.25)">&#x276F;</text>
  <!-- Big earnings number -->
  <text x="250" y="220" font-size="44" font-weight="700" fill="rgba(255,255,255,0.9)" text-anchor="middle">&#163;3,240</text>
  <text x="250" y="244" font-size="12" fill="rgba(255,255,255,0.3)" text-anchor="middle">This week &#xB7; +8% vs last</text>
  <!-- Mini bar chart (7 day) -->
  <rect x="60" y="264" width="380" height="90" rx="10" fill="rgba(13,11,28,0.6)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
