  <rect x="80" y="330" width="32" height="20" rx="3" fill="#2B8CEE" opacity="0.25"/>
  <text x="96" y="350" font-size="9" fill="rgba(255,255,255,0.25)" text-anchor="middle">Mon</text>
  <rect x="126" y="318" width="32" height="32" rx="3" fill="#2B8CEE" opacity="0.35"/>
  <text x="142" y="358" font-size="9" fill="rgba(255,255,255,0.25)" text-anchor="middle">Tue</text>
  <rect x="172" y="298" width="32" height="52" rx="3" fill="#2B8CEE" opacity="0.5"/>
  <text x="188" y="358" font-size="9" fill="rgba(255,255,255,0.25)" text-anchor="middle">Wed</text>
  <rect x="218" y="310" width="32" height="40" rx="3" fill="#2B8CEE" opacity="0.4"/>
  <text x="234" y="358" font-size="9" fill="rgba(255,255,255,0.25)" text-anchor="middle">Thu</text>
  <rect x="264" y="282" width="32" height="68" rx="3" fill="#2B8CEE" opacity="0.65"/>
