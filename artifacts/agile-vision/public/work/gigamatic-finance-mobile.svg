  <rect x="310" y="336" width="32" height="14" rx="3" fill="#2B8CEE" opacity="0.18"/>
  <text x="326" y="358" font-size="9" fill="rgba(255,255,255,0.2)" text-anchor="middle">Sat</text>
  <rect x="356" y="340" width="32" height="10" rx="3" fill="#2B8CEE" opacity="0.12"/>
  <text x="372" y="358" font-size="9" fill="rgba(255,255,255,0.18)" text-anchor="middle">Sun</text>
  <!-- Source breakdown -->
  <text x="60" y="392" font-size="11" fill="rgba(255,255,255,0.3)" letter-spacing="1.5">BREAKDOWN</text>
  <!-- Freelance row -->
  <rect x="60" y="404" width="380" height="54" rx="8" fill="rgba(43,140,238,0.08)" stroke="rgba(43,140,238,0.16)" stroke-width="1"/>
  <circle cx="82" cy="431" r="14" fill="rgba(43,140,238,0.18)"/>
  <text x="82" y="436" font-size="11" fill="#2B8CEE" text-anchor="middle">F</text>
  <text x="106" y="426" font-size="12" font-weight="600" fill="rgba(255,255,255,0.75)">Freelance</text>
  <text x="106" y="442" font-size="11" fill="rgba(255,255,255,0.3)">2 invoices paid</text>
  <text x="420" y="432" font-size="14" font-weight="700" fill="rgba(255,255,255,0.8)" text-anchor="end">&#163;1,840</text>
  <!-- Platform row -->
  <rect x="60" y="468" width="380" height="54" rx="8" fill="rgba(43,140,238,0.05)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="82" cy="495" r="14" fill="rgba(43,140,238,0.1)"/>
  <text x="82" y="500" font-size="11" fill="#2B8CEE" text-anchor="middle" opacity="0.7">P</text>
  <text x="106" y="490" font-size="12" font-weight="600" fill="rgba(255,255,255,0.62)">Platform</text>
  <text x="106" y="506" font-size="11" fill="rgba(255,255,255,0.25)">Deliveroo + Uber</text>
  <text x="420" y="496" font-size="14" font-weight="700" fill="rgba(255,255,255,0.65)" text-anchor="end">&#163;920</text>
  <!-- Retainer -->
  <rect x="60" y="532" width="380" height="54" rx="8" fill="rgba(43,140,238,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="82" cy="559" r="14" fill="rgba(43,140,238,0.06)"/>
  <text x="82" y="564" font-size="11" fill="#2B8CEE" text-anchor="middle" opacity="0.45">R</text>
  <text x="106" y="554" font-size="12" font-weight="600" fill="rgba(255,255,255,0.5)">Retainer</text>
  <text x="106" y="570" font-size="11" fill="rgba(255,255,255,0.2)">Studio</text>
  <text x="420" y="560" font-size="14" font-weight="700" fill="rgba(255,255,255,0.52)" text-anchor="end">&#163;480</text>
  <!-- AI insight -->
  <rect x="60" y="602" width="380" height="60" rx="10" fill="rgba(43,140,238,0.06)" stroke="rgba(43,140,238,0.18)" stroke-width="1"/>
  <text x="80" y="624" font-size="10" fill="#2B8CEE" letter-spacing="1.5">AI INSIGHT</text>
  <text x="80" y="642" font-size="11" fill="rgba(255,255,255,0.52)">Strong week. Friday was your</text>
  <text x="80" y="656" font-size="11" fill="rgba(255,255,255,0.52)">best income day. Q4 on track.</text>
  <!-- Readiness quick view -->
  <rect x="60" y="678" width="180" height="68" rx="10" fill="#0d0b1e" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="80" y="700" font-size="10" fill="rgba(255,255,255,0.28)">Readiness</text>
  <text x="80" y="724" font-size="22" font-weight="700" fill="#2B8CEE">74</text>
  <text x="106" y="724" font-size="12" fill="rgba(255,255,255,0.22)">/100</text>
  <rect x="80" y="730" width="140" height="4" rx="2" fill="rgba(255,255,255,0.05)"/>
  <rect x="80" y="730" width="104" height="4" rx="2" fill="#2B8CEE" opacity="0.5"/>
  <rect x="260" y="678" width="180" height="68" rx="10" fill="#0d0b1e" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="280" y="700" font-size="10" fill="rgba(255,255,255,0.28)">Products</text>
  <text x="280" y="724" font-size="22" font-weight="700" fill="rgba(255,255,255,0.7)">12</text>
  <text x="304" y="724" font-size="12" fill="rgba(255,255,255,0.22)">available</text>
  <!-- Bottom nav -->
  <rect x="26" y="758" width="448" height="76" rx="0" fill="#0c0a1c"/>
  <rect x="26" y="758" width="448" height="1" fill="rgba(255,255,255,0.07)"/>
  <circle cx="120" cy="796" r="4" fill="#2B8CEE"/>
  <circle cx="250" cy="796" r="4" fill="rgba(255,255,255,0.2)"/>
  <circle cx="380" cy="796" r="4" fill="rgba(255,255,255,0.2)"/>
  <text x="120" y="812" font-size="9" fill="#2B8CEE" text-anchor="middle">Home</text>
  <text x="250" y="812" font-size="9" fill="rgba(255,255,255,0.28)" text-anchor="middle">Income</text>
  <text x="380" y="812" font-size="9" fill="rgba(255,255,255,0.28)" text-anchor="middle">Products</text>
</svg>
