<svg xmlns="http://www.w3.org/2000/svg" width="500" height="860" viewBox="0 0 500 860">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070612"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13B5EC"/>
      <stop offset="100%" stop-color="#40d0ff"/>
    </linearGradient>
    <linearGradient id="map" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1a2e"/>
      <stop offset="100%" stop-color="#0a1420"/>
    </linearGradient>
  </defs>

  <!-- Phone body -->
  <rect x="0" y="0" width="500" height="860" rx="40" fill="url(#bg)"/>

  <!-- Status bar -->
  <rect x="0" y="0" width="500" height="50" rx="40" fill="rgba(255,255,255,0.03)"/>
  <text x="40" y="32" font-family="system-ui,sans-serif" font-size="13" fill="white" font-weight="600">9:41</text>
  <!-- Signal/battery -->
  <rect x="400" y="20" width="36" height="16" rx="4" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <rect x="402" y="22" width="28" height="12" rx="2" fill="#13B5EC"/>
  <rect x="438" y="24" width="4" height="8" rx="1" fill="rgba(255,255,255,0.4)"/>

  <!-- App header -->
  <rect x="0" y="50" width="500" height="60" fill="rgba(255,255,255,0.02)"/>
  <text x="40" y="88" font-family="system-ui,sans-serif" font-size="20" fill="white" font-weight="700">Hudson</text>
  <!-- Avatar -->
  <circle cx="452" cy="80" r="20" fill="rgba(19,181,236,0.2)" stroke="rgba(19,181,236,0.4)" stroke-width="1.5"/>
  <text x="452" y="86" font-family="system-ui,sans-serif" font-size="14" fill="#13B5EC" text-anchor="middle" font-weight="700">A</text>

  <!-- Map strip -->
  <rect x="0" y="110" width="500" height="220" fill="url(#map)"/>
  <!-- Map grid lines -->
  <line x1="0" y1="150" x2="500" y2="150" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="190" x2="500" y2="190" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="230" x2="500" y2="230" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="270" x2="500" y2="270" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="100" y1="110" x2="100" y2="330" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="200" y1="110" x2="200" y2="330" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="300" y1="110" x2="300" y2="330" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="400" y1="110" x2="400" y2="330" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <!-- Roads -->
  <line x1="0" y1="220" x2="500" y2="220" stroke="rgba(19,181,236,0.15)" stroke-width="3"/>
  <line x1="250" y1="110" x2="250" y2="330" stroke="rgba(19,181,236,0.15)" stroke-width="2"/>
  <!-- Route line -->
  <path d="M80 310 Q180 240 250 220 Q340 198 420 160" stroke="#13B5EC" stroke-width="2.5" fill="none" stroke-dasharray="6,3" stroke-linecap="round"/>
  <!-- Destination pin -->
  <circle cx="420" cy="160" r="10" fill="#13B5EC"/>
  <circle cx="420" cy="160" r="6" fill="white"/>
  <!-- Origin pin -->
  <circle cx="80" cy="310" r="8" fill="rgba(19,181,236,0.5)" stroke="#13B5EC" stroke-width="2"/>
  <!-- Hotel markers -->
  <rect x="188" y="206" width="24" height="24" rx="4" fill="#13B5EC"/>
  <text x="200" y="222" font-family="system-ui,sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="700">H</text>
  <rect x="310" y="178" width="24" height="24" rx="4" fill="rgba(19,181,236,0.5)" stroke="#13B5EC" stroke-width="1"/>
  <text x="322" y="194" font-family="system-ui,sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="700">H</text>
  <!-- Map label -->
  <text x="420" y="148" font-family="system-ui,sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">Tokyo</text>

  <!-- Chat interface -->
  <rect x="0" y="330" width="500" height="420" fill="rgba(0,0,0,0.2)"/>

  <!-- Trip context pill -->
  <rect x="20" y="346" width="460" height="44" rx="22" fill="rgba(19,181,236,0.1)" stroke="rgba(19,181,236,0.2)" stroke-width="1"/>
  <text x="250" y="366" font-family="system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">Planning: Tokyo · 7 nights · 2 travelers</text>
  <text x="250" y="382" font-family="system-ui,sans-serif" font-size="11" fill="#13B5EC" text-anchor="middle">March 14 – 21, 2025</text>

  <!-- AI message 1 -->
  <rect x="20" y="406" width="320" height="72" rx="16" rx-tr="4" fill="rgba(19,181,236,0.1)" stroke="rgba(19,181,236,0.15)" stroke-width="1"/>
  <text x="36" y="428" font-family="system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">I've found a great base in Shinjuku</text>
  <text x="36" y="446" font-family="system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">for your trip. Want me to build</text>
  <text x="36" y="464" font-family="system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">an itinerary around it?</text>
  <text x="36" y="478" font-family="system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.3)">Hudson · 9:32 AM</text>

  <!-- Hotel card -->
  <rect x="20" y="490" width="320" height="90" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="20" y="490" width="64" height="90" rx="12" fill="rgba(19,181,236,0.15)"/>
  <text x="52" y="540" font-family="system-ui,sans-serif" font-size="20" fill="#13B5EC" text-anchor="middle">🏨</text>
  <text x="100" y="514" font-family="system-ui,sans-serif" font-size="13" fill="white" font-weight="600">Park Hyatt Tokyo</text>
  <text x="100" y="532" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Shinjuku · 4.9 ★ · Luxury</text>
  <text x="100" y="550" font-family="system-ui,sans-serif" font-size="12" fill="#13B5EC" font-weight="600">¥48,000/night</text>
  <text x="100" y="570" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Incl. breakfast · Free cancellation</text>

  <!-- User reply -->
  <rect x="160" y="596" width="320" height="44" rx="16" fill="rgba(19,181,236,0.2)" stroke="rgba(19,181,236,0.3)" stroke-width="1"/>
  <text x="180" y="618" font-family="system-ui,sans-serif" font-size="12" fill="white">Yes! Focus on culture and food.</text>
  <text x="180" y="632" font-family="system-ui,sans-serif" font-size="12" fill="white">We love local markets.</text>

  <!-- AI response 2 -->
  <rect x="20" y="654" width="340" height="56" rx="16" fill="rgba(19,181,236,0.1)" stroke="rgba(19,181,236,0.15)" stroke-width="1"/>
  <text x="36" y="676" font-family="system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">Perfect! Building your 7-day itinerary</text>
  <text x="36" y="694" font-family="system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">with Tsukiji, Yanaka + hidden gems...</text>

  <!-- Typing indicator -->
  <rect x="20" y="722" width="72" height="36" rx="18" fill="rgba(19,181,236,0.08)" stroke="rgba(19,181,236,0.12)" stroke-width="1"/>
  <circle cx="44" cy="740" r="4" fill="#13B5EC" fill-opacity="0.6"/>
  <circle cx="56" cy="740" r="4" fill="#13B5EC" fill-opacity="0.8"/>
  <circle cx="68" cy="740" r="4" fill="#13B5EC"/>

  <!-- Input bar -->
  <rect x="0" y="758" width="500" height="82" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <rect x="20" y="772" width="380" height="44" rx="22" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="44" y="798" font-family="system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.3)">Message Hudson...</text>
  <circle cx="456" cy="794" r="22" fill="#13B5EC"/>
  <text x="456" y="800" font-family="system-ui,sans-serif" font-size="18" fill="white" text-anchor="middle">↑</text>

  <!-- Home indicator -->
  <rect x="180" y="834" width="140" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
</svg>
