    <text x="80" y="67" font-size="13" fill="#F0EBE0">and the Future of Consciousness</text>
    <text x="550" y="56" font-size="10.5" fill="#C9A84C" letter-spacing="1.5" font-weight="600">ABOUT</text>
    <text x="618" y="56" font-size="10.5" fill="#9BA3AF" letter-spacing="1.5">THINKING</text>
    <text x="705" y="56" font-size="10.5" fill="#9BA3AF" letter-spacing="1.5">OP-EDS</text>
    <text x="769" y="56" font-size="10.5" fill="#9BA3AF" letter-spacing="1.5">DISPATCH</text>
    <text x="845" y="56" font-size="10.5" fill="#9BA3AF" letter-spacing="1.5">ENGAGE</text>
    <line x1="920" y1="43" x2="920" y2="67" stroke="#9BA3AF" stroke-opacity="0.3" stroke-width="0.8"/>
    <text x="933" y="56" font-size="10.5" fill="#9BA3AF" letter-spacing="1.5">AUDIENCES</text>
    <rect x="1090" y="38" width="148" height="27" fill="none" stroke="#C9A84C" stroke-width="1" rx="2"/>
    <text x="1164" y="56" font-size="9.5" fill="#C9A84C" font-weight="600" letter-spacing="1" text-anchor="middle">BECOME A PARTNER</text>
    <rect x="1250" y="38" width="108" height="27" fill="none" stroke="#C9A84C" stroke-width="1" rx="2"/>
    <text x="1304" y="56" font-size="9.5" fill="#C9A84C" font-weight="600" letter-spacing="1" text-anchor="middle">GET INVOLVED</text>
    <rect x="1370" y="38" width="100" height="27" fill="url(#gold-cov)" rx="2"/>
    <text x="1420" y="56" font-size="9.5" fill="#060912" font-weight="700" letter-spacing="1" text-anchor="middle">DONATE NOW</text>
  </g>
  <line x1="80" y1="82" x2="1520" y2="82" stroke="#C9A84C" stroke-opacity="0.12" stroke-width="0.5"/>

  <!-- Badge -->
  <g transform="translate(80,155)">
    <line x1="0" y1="9" x2="28" y2="9" stroke="#C9A84C" stroke-width="1.5"/>
    <text x="36" y="14" font-family="system-ui,sans-serif" font-size="11" fill="#C9A84C" letter-spacing="2.5" font-weight="500">INTERDISCIPLINARY RESEARCH INSTITUTE</text>
  </g>

  <!-- Headline -->
  <g font-family="Georgia,'Times New Roman',serif">
    <text x="80" y="258" font-size="76" fill="#EDE8DC" font-weight="400" letter-spacing="-1">Exploring how AI is</text>
    <text x="80" y="346" font-size="76" fill="#EDE8DC" font-weight="400" letter-spacing="-1">reshaping</text>
    <text x="338" y="346" font-size="76" fill="#C9A84C" font-weight="400" letter-spacing="-1" filter="url(#glow-cov)"> cognition,</text>
    <text x="80" y="434" font-size="76" fill="#C9A84C" font-weight="400" letter-spacing="-1" filter="url(#glow-cov)">identity,</text>
    <text x="80" y="522" font-size="76" fill="#C9A84C" font-weight="400" letter-spacing="-1" filter="url(#glow-cov)">and society</text>
  </g>

  <!-- Subtitle -->
  <text x="80" y="592" font-family="system-ui,sans-serif" font-size="17" fill="#8A919E" letter-spacing="0.2">We study how intelligent systems are reshaping cognition, identity,</text>
  <text x="80" y="614" font-family="system-ui,sans-serif" font-size="17" fill="#8A919E" letter-spacing="0.2">agency, and society — translating research into public understanding,</text>
  <text x="80" y="636" font-family="system-ui,sans-serif" font-size="17" fill="#8A919E" letter-spacing="0.2">policy, and education.</text>

  <!-- CTAs -->
  <rect x="80" y="675" width="205" height="50" fill="none" stroke="#EDE8DC" stroke-width="1.5" rx="2"/>
  <text x="183" y="705" font-family="system-ui,sans-serif" font-size="12" fill="#EDE8DC" font-weight="600" letter-spacing="1.5" text-anchor="middle">EXPLORE OUR WORK</text>
  <rect x="300" y="675" width="168" height="50" fill="url(#gold-cov)" rx="2"/>
  <text x="384" y="705" font-family="system-ui,sans-serif" font-size="12" fill="#060912" font-weight="700" letter-spacing="1.5" text-anchor="middle">GET INVOLVED</text>

