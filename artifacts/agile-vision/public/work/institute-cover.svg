<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="bg-cov" cx="70%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#131828"/>
      <stop offset="100%" stop-color="#060912"/>
    </radialGradient>
    <radialGradient id="head-cov" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-cov"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="gold-cov" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A84C"/><stop offset="100%" stop-color="#E2C97E"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg-cov)"/>

  <!-- Scattered particles -->
  <g opacity="0.2" fill="#C9A84C">
    <circle cx="110" cy="75" r="1.5"/><circle cx="350" cy="40" r="1"/><circle cx="580" cy="120" r="1.5"/>
    <circle cx="200" cy="210" r="1"/><circle cx="480" cy="165" r="1.5"/><circle cx="85" cy="360" r="1"/>
    <circle cx="310" cy="830" r="1.5"/><circle cx="590" cy="860" r="1"/><circle cx="140" cy="760" r="1.5"/>
    <circle cx="660" cy="290" r="1"/><circle cx="50" cy="510" r="1.5"/><circle cx="710" cy="670" r="1"/>
    <circle cx="800" cy="50" r="1"/><circle cx="1480" cy="110" r="1.5"/><circle cx="1540" cy="280" r="1"/>
    <circle cx="1505" cy="810" r="1.5"/><circle cx="1420" cy="840" r="1"/>
    <circle cx="980" cy="30" r="1"/><circle cx="790" cy="875" r="1.5"/>
  </g>

  <!-- Nav -->
