<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg-op" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1A"/><stop offset="100%" stop-color="#070C14"/>
    </linearGradient>
    <linearGradient id="gold-op" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A84C"/><stop offset="100%" stop-color="#E2C97E"/>
    </linearGradient>
  </defs>

  <!-- Browser chrome -->
  <rect width="1600" height="900" rx="8" fill="#1C1C1E"/>
  <rect x="0" y="0" width="1600" height="42" rx="8" fill="#2A2A2D"/>
  <rect x="0" y="30" width="1600" height="12" fill="#2A2A2D"/>
  <circle cx="24" cy="21" r="6" fill="#FF5F57"/><circle cx="44" cy="21" r="6" fill="#FEBC2E"/><circle cx="64" cy="21" r="6" fill="#28C840"/>
  <rect x="200" y="11" width="840" height="20" rx="5" fill="#3A3A3D"/>
  <text x="620" y="25" font-family="system-ui,sans-serif" font-size="11" fill="#8A8A8E" text-anchor="middle">futureofconsciousness.global/op-eds</text>

  <!-- Site bg -->
  <rect x="0" y="42" width="1600" height="858" fill="url(#bg-op)"/>

  <!-- Nav -->
  <g font-family="system-ui,-apple-system,sans-serif">
    <text x="96" y="88" font-size="12" fill="#F0EBE0">The Institute for AI</text>
    <text x="96" y="103" font-size="12" fill="#F0EBE0">and the Future of Consciousness</text>
    <text x="542" y="95" font-size="10" fill="#9BA3AF" letter-spacing="1.5">ABOUT</text>
    <text x="603" y="95" font-size="10" fill="#9BA3AF" letter-spacing="1.5">THINKING</text>
    <text x="694" y="95" font-size="10" fill="#C9A84C" letter-spacing="1.5" font-weight="600">OP-EDS</text>
    <text x="756" y="95" font-size="10" fill="#9BA3AF" letter-spacing="1.5">DISPATCH</text>
    <text x="830" y="95" font-size="10" fill="#9BA3AF" letter-spacing="1.5">ENGAGE</text>
    <line x1="903" y1="82" x2="903" y2="107" stroke="#9BA3AF" stroke-opacity="0.3" stroke-width="0.8"/>
    <text x="916" y="95" font-size="10" fill="#9BA3AF" letter-spacing="1.5">AUDIENCES</text>
    <rect x="1090" y="78" width="148" height="25" fill="none" stroke="#C9A84C" stroke-width="1" rx="2"/>
    <text x="1164" y="95" font-size="9" fill="#C9A84C" font-weight="600" letter-spacing="1" text-anchor="middle">BECOME A PARTNER</text>
    <rect x="1250" y="78" width="108" height="25" fill="none" stroke="#C9A84C" stroke-width="1" rx="2"/>
    <text x="1304" y="95" font-size="9" fill="#C9A84C" font-weight="600" letter-spacing="1" text-anchor="middle">GET INVOLVED</text>
    <rect x="1370" y="78" width="100" height="25" fill="url(#gold-op)" rx="2"/>
    <text x="1420" y="95" font-size="9" fill="#060912" font-weight="700" letter-spacing="1" text-anchor="middle">DONATE NOW</text>
  </g>
  <line x1="96" y1="118" x2="1520" y2="118" stroke="#C9A84C" stroke-opacity="0.12" stroke-width="0.5"/>

  <!-- Page header -->
  <text x="96" y="162" font-family="system-ui,sans-serif" font-size="11" fill="#C9A84C" letter-spacing="2.5" font-weight="500">INSTITUTE PUBLICATIONS</text>
  <text x="96" y="232" font-family="Georgia,'Times New Roman',serif" font-size="76" fill="#EDE8DC" font-weight="400" letter-spacing="-1">Op-Eds</text>
  <text x="96" y="268" font-family="system-ui,sans-serif" font-size="16" fill="#7A8290">Opinion and analysis from the Institute on the most consequential questions</text>
  <text x="96" y="288" font-family="system-ui,sans-serif" font-size="16" fill="#7A8290">in AI, consciousness, and human flourishing. Each piece sets out a clear</text>
  <text x="96" y="308" font-family="system-ui,sans-serif" font-size="16" fill="#7A8290">argument and draws on the best available evidence.</text>

  <!-- Stats bar -->
  <line x1="0" y1="335" x2="1600" y2="335" stroke="#C9A84C" stroke-opacity="0.1" stroke-width="1"/>
  <rect x="0" y="335" width="1600" height="95" fill="#080C14"/>

  <!-- Stat items -->
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <!-- 12 Publications -->
    <g transform="translate(280,382)">
      <text x="0" y="0" font-family="Georgia,serif" font-size="40" fill="#C9A84C" font-weight="400">12</text>
      <text x="0" y="22" font-size="11" fill="#9BA3AF" letter-spacing="1.5" font-weight="500">PUBLICATIONS</text>
    </g>
    <line x1="560" y1="348" x2="560" y2="418" stroke="#C9A84C" stroke-opacity="0.15" stroke-width="1"/>
    <!-- 4 Research Domains -->
    <g transform="translate(720,382)">
      <text x="0" y="0" font-family="Georgia,serif" font-size="40" fill="#C9A84C" font-weight="400">4</text>
      <text x="0" y="22" font-size="11" fill="#9BA3AF" letter-spacing="1.5" font-weight="500">RESEARCH DOMAINS</text>
    </g>
    <line x1="920" y1="348" x2="920" y2="418" stroke="#C9A84C" stroke-opacity="0.15" stroke-width="1"/>
    <!-- 5 Policy Briefs -->
    <g transform="translate(1080,382)">
      <text x="0" y="0" font-family="Georgia,serif" font-size="40" fill="#C9A84C" font-weight="400">5</text>
      <text x="0" y="22" font-size="11" fill="#9BA3AF" letter-spacing="1.5" font-weight="500">POLICY BRIEFS</text>
    </g>
    <line x1="1280" y1="348" x2="1280" y2="418" stroke="#C9A84C" stroke-opacity="0.15" stroke-width="1"/>
    <!-- 411 Pages -->
    <g transform="translate(1440,382)">
      <text x="0" y="0" font-family="Georgia,serif" font-size="40" fill="#C9A84C" font-weight="400">411</text>
      <text x="0" y="22" font-size="11" fill="#9BA3AF" letter-spacing="1.5" font-weight="500">PAGES PUBLISHED</text>
    </g>
  </g>
  <line x1="0" y1="430" x2="1600" y2="430" stroke="#C9A84C" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Publication type filters -->
  <g font-family="system-ui,sans-serif" font-size="12" font-weight="500">
    <!-- Briefing Papers - active -->
    <rect x="96" y="448" width="156" height="32" rx="4" fill="url(#gold-op)" filter="url(#tag-shadow)"/>
    <text x="174" y="469" fill="#060912" font-weight="700" text-anchor="middle">Briefing Papers</text>
    <rect x="164" y="450" width="20" height="18" rx="9" fill="#060912" fill-opacity="0.2" transform="translate(-6,0)"/>
    <text x="242" y="469" fill="#060912" font-size="11" font-weight="700">5</text>
    <!-- Perspectives -->
    <rect x="268" y="448" width="140" height="32" rx="4" fill="none" stroke="#C9A84C" stroke-opacity="0.3" stroke-width="1"/>
    <text x="338" y="469" fill="#C9A84C" text-anchor="middle">Perspectives</text>
    <text x="388" y="469" fill="#C9A84C" font-size="11">6</text>
    <!-- Letters from ED -->
    <rect x="424" y="448" width="258" height="32" rx="4" fill="none" stroke="#C9A84C" stroke-opacity="0.3" stroke-width="1"/>
    <text x="553" y="469" fill="#C9A84C" text-anchor="middle">Letters from the Executive Director</text>
    <text x="662" y="469" fill="#C9A84C" font-size="11">2</text>
  </g>

  <!-- Article cards -->
  <!-- Card 1 -->
  <rect x="96" y="504" width="718" height="360" rx="4" fill="#0D1120" stroke="#C9A84C" stroke-opacity="0.08" stroke-width="1"/>
  <g transform="translate(112,524)">
    <rect x="0" y="0" width="176" height="22" rx="3" fill="#C9A84C" fill-opacity="0.12" stroke="#C9A84C" stroke-opacity="0.35" stroke-width="1"/>
    <text x="88" y="16" font-family="system-ui,sans-serif" font-size="10" fill="#C9A84C" font-weight="600" letter-spacing="1.2" text-anchor="middle">ATTENTION &amp; COGNITION</text>
    <text x="200" y="16" font-family="system-ui,sans-serif" font-size="12" fill="#7A8290">April 2025</text>
    <text x="0" y="62" font-family="Georgia,serif" font-size="22" fill="#EDE8DC">Protecting Cognitive Capacity:</text>
    <text x="0" y="90" font-family="Georgia,serif" font-size="22" fill="#EDE8DC">Design Standards for</text>
    <text x="0" y="118" font-family="Georgia,serif" font-size="22" fill="#EDE8DC">Attention-Harvesting AI</text>
    <text x="0" y="152" font-family="system-ui,sans-serif" font-size="14" fill="#7A8290">Presents evidence that algorithmically fragmented attention</text>
    <text x="0" y="172" font-family="system-ui,sans-serif" font-size="14" fill="#7A8290">produces measurable declines in comprehension, deliberative</text>
    <text x="0" y="192" font-family="system-ui,sans-serif" font-size="14" fill="#7A8290">capacity, and cognitive autonomy — and proposes product design</text>
    <text x="0" y="212" font-family="system-ui,sans-serif" font-size="14" fill="#7A8290">standards for attention-respecting AI interfaces.</text>
    <line x1="0" y1="240" x2="686" y2="240" stroke="#C9A84C" stroke-opacity="0.08" stroke-width="1"/>
    <text x="0" y="272" font-family="system-ui,sans-serif" font-size="12" fill="#C9A84C" letter-spacing="1">READ BRIEFING PAPER →</text>
    <text x="200" y="272" font-family="system-ui,sans-serif" font-size="12" fill="#5A6270">Briefing Paper · 34 pages</text>
  </g>

  <!-- Card 2 -->
  <rect x="830" y="504" width="718" height="360" rx="4" fill="#0D1120" stroke="#C9A84C" stroke-opacity="0.08" stroke-width="1"/>
  <g transform="translate(846,524)">
    <rect x="0" y="0" width="164" height="22" rx="3" fill="#C9A84C" fill-opacity="0.12" stroke="#C9A84C" stroke-opacity="0.35" stroke-width="1"/>
    <text x="82" y="16" font-family="system-ui,sans-serif" font-size="10" fill="#C9A84C" font-weight="600" letter-spacing="1.2" text-anchor="middle">AGENCY &amp; AUTONOMY</text>
    <text x="180" y="16" font-family="system-ui,sans-serif" font-size="12" fill="#7A8290">February 2025</text>
    <text x="0" y="62" font-family="Georgia,serif" font-size="22" fill="#EDE8DC">Cognitive Sovereignty Under</text>
    <text x="0" y="90" font-family="Georgia,serif" font-size="22" fill="#EDE8DC">Algorithmic Persuasion:</text>
    <text x="0" y="118" font-family="Georgia,serif" font-size="22" fill="#EDE8DC">A Legislative Framework</text>
    <text x="0" y="152" font-family="system-ui,sans-serif" font-size="14" fill="#7A8290">Examines how AI systems capable of targeting individual</text>
    <text x="0" y="172" font-family="system-ui,sans-serif" font-size="14" fill="#7A8290">psychological profiles at scale create a qualitatively new</text>
    <text x="0" y="192" font-family="system-ui,sans-serif" font-size="14" fill="#7A8290">challenge for democratic governance — and proposes a</text>
    <text x="0" y="212" font-family="system-ui,sans-serif" font-size="14" fill="#7A8290">framework for legislative response grounded in cognitive rights.</text>
    <line x1="0" y1="240" x2="686" y2="240" stroke="#C9A84C" stroke-opacity="0.08" stroke-width="1"/>
    <text x="0" y="272" font-family="system-ui,sans-serif" font-size="12" fill="#C9A84C" letter-spacing="1">READ BRIEFING PAPER →</text>
    <text x="200" y="272" font-family="system-ui,sans-serif" font-size="12" fill="#5A6270">Briefing Paper · 42 pages</text>
  </g>
</svg>
