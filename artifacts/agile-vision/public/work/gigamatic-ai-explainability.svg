<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#06060F"/><stop offset="100%" stop-color="#0A071A"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg4)"/>
  <!-- Nav -->
  <rect width="1600" height="60" fill="rgba(6,6,15,0.92)"/>
  <rect y="59" width="1600" height="1" fill="rgba(255,255,255,0.05)"/>
  <text x="36" y="37" font-size="17" font-weight="800" fill="#A78BFA" letter-spacing="-0.5" font-style="italic">GIGAMATIC</text>
  <text x="185" y="37" font-size="13" fill="rgba(255,255,255,0.38)">AI Tools</text>
  <text x="252" y="37" font-size="13" fill="rgba(255,255,255,0.38)">Learn</text>
  <text x="308" y="37" font-size="13" fill="rgba(255,255,255,0.38)">Resources</text>
  <text x="390" y="37" font-size="13" fill="rgba(255,255,255,0.38)">Blog</text>
  <text x="436" y="37" font-size="13" fill="rgba(255,255,255,0.38)">Events</text>
  <text x="496" y="37" font-size="13" fill="rgba(255,255,255,0.38)">AI News</text>
  <text x="562" y="37" font-size="13" fill="#A78BFA" font-weight="600">My Stack</text>
  <!-- Page header -->
  <text x="80" y="114" font-size="34" font-weight="800" fill="white" letter-spacing="-1">My AI Stack</text>
  <text x="80" y="142" font-size="15" fill="rgba(255,255,255,0.4)">Your personal collection of verified AI tools — organised, shareable, and always up to date</text>
  <!-- Stack summary bar -->
  <rect x="80" y="162" width="1480" height="70" rx="10" fill="rgba(124,58,237,0.07)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="120" y="196" font-size="28" font-weight="800" fill="white">7</text>
  <text x="120" y="216" font-size="11" fill="rgba(255,255,255,0.35)" letter-spacing="1">TOOLS IN STACK</text>
  <line x1="200" y1="180" x2="200" y2="220" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="230" y="196" font-size="15" fill="rgba(255,255,255,0.6)">4 categories</text>
  <line x1="380" y1="180" x2="380" y2="220" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="410" y="196" font-size="15" fill="rgba(255,255,255,0.6)">Last updated: today</text>
  <rect x="1270" y="180" width="260" height="34" rx="6" fill="rgba(124,58,237,0.15)" stroke="rgba(124,58,237,0.35)" stroke-width="1"/>
  <text x="1400" y="202" font-size="13" fill="#A78BFA" text-anchor="middle" font-weight="600">Share My Stack →</text>
  <!-- Stack categories -->
  <!-- Section: Writing & Content -->
  <text x="80" y="270" font-size="12" font-weight="600" fill="rgba(255,255,255,0.3)" letter-spacing="1.5">WRITING &amp; CONTENT</text>
  <rect x="80" y="284" width="1480" height="100" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Tool row 1 -->
  <rect x="104" y="300" width="36" height="36" rx="9" fill="rgba(99,102,241,0.3)"/>
  <text x="122" y="323" font-size="20" text-anchor="middle" fill="#818CF8">◆</text>
