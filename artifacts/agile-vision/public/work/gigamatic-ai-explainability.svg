  <text x="156" y="332" font-size="12" fill="rgba(255,255,255,0.38)">Primary writing assistant · GPT-4o</text>
  <rect x="156" y="346" width="90" height="18" rx="9" fill="rgba(0,196,106,0.1)" stroke="rgba(0,196,106,0.2)" stroke-width="1"/>
  <text x="201" y="359" font-size="9" fill="#00C46A" text-anchor="middle">Daily use</text>
  <line x1="440" y1="298" x2="440" y2="376" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <rect x="464" y="300" width="36" height="36" rx="9" fill="rgba(239,68,68,0.2)"/>
  <text x="482" y="323" font-size="20" text-anchor="middle" fill="#F87171">◈</text>
  <text x="516" y="314" font-size="14" font-weight="600" fill="rgba(255,255,255,0.85)">Claude</text>
  <text x="516" y="332" font-size="12" fill="rgba(255,255,255,0.38)">Long-form analysis and editing</text>
  <rect x="516" y="346" width="84" height="18" rx="9" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="558" y="359" font-size="9" fill="rgba(255,255,255,0.3)" text-anchor="middle">Weekly use</text>
  <rect x="1436" y="296" width="100" height="28" rx="6" fill="rgba(255,255,255,0.05)"/>
  <text x="1486" y="314" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="middle">✕ Remove</text>
  <!-- Section: Research -->
  <text x="80" y="420" font-size="12" font-weight="600" fill="rgba(255,255,255,0.3)" letter-spacing="1.5">RESEARCH</text>
  <rect x="80" y="434" width="1480" height="100" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="104" y="450" width="36" height="36" rx="9" fill="rgba(16,185,129,0.2)"/>
  <text x="122" y="473" font-size="20" text-anchor="middle" fill="#34D399">⬡</text>
  <text x="156" y="464" font-size="14" font-weight="600" fill="rgba(255,255,255,0.85)">Perplexity</text>
  <text x="156" y="482" font-size="12" fill="rgba(255,255,255,0.38)">Real-time search with citations</text>
  <rect x="156" y="496" width="90" height="18" rx="9" fill="rgba(0,196,106,0.1)" stroke="rgba(0,196,106,0.2)" stroke-width="1"/>
  <text x="201" y="509" font-size="9" fill="#00C46A" text-anchor="middle">Daily use</text>
  <!-- Section: Coding -->
  <text x="80" y="570" font-size="12" font-weight="600" fill="rgba(255,255,255,0.3)" letter-spacing="1.5">CODING</text>
  <rect x="80" y="584" width="1480" height="100" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="104" y="600" width="36" height="36" rx="9" fill="rgba(124,58,237,0.3)"/>
  <text x="122" y="623" font-size="20" text-anchor="middle" fill="#A78BFA">⌥</text>
  <text x="156" y="614" font-size="14" font-weight="600" fill="rgba(255,255,255,0.85)">Cursor</text>
  <text x="156" y="632" font-size="12" fill="rgba(255,255,255,0.38)">AI code editor · Primary IDE</text>
  <rect x="156" y="646" width="90" height="18" rx="9" fill="rgba(0,196,106,0.1)" stroke="rgba(0,196,106,0.2)" stroke-width="1"/>
  <text x="201" y="659" font-size="9" fill="#00C46A" text-anchor="middle">Daily use</text>
  <!-- Add tool CTA -->
  <rect x="80" y="706" width="1480" height="64" rx="10" fill="rgba(124,58,237,0.04)" stroke="rgba(124,58,237,0.15)" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="800" y="742" font-size="14" fill="rgba(255,255,255,0.3)" text-anchor="middle">+ Add a tool to your stack</text>
  <rect x="1280" y="718" width="240" height="30" rx="6" fill="rgba(124,58,237,0.12)" stroke="rgba(124,58,237,0.25)" stroke-width="1"/>
  <text x="1400" y="737" font-size="12" fill="#A78BFA" text-anchor="middle" font-weight="600">Browse Directory →</text>
  <!-- Tips -->
  <rect x="80" y="788" width="720" height="80" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="110" y="816" font-size="13" font-weight="600" fill="rgba(255,255,255,0.6)">💡 Stack tip</text>
  <text x="110" y="838" font-size="13" fill="rgba(255,255,255,0.38)">Your stack is private by default. Share it publicly to help others discover the tools you use.</text>
  <rect x="830" y="788" width="730" height="80" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="860" y="816" font-size="13" font-weight="600" fill="rgba(255,255,255,0.6)">🔔 Alerts</text>
  <text x="860" y="838" font-size="13" fill="rgba(255,255,255,0.38)">Get notified when tools in your stack release major updates or change pricing.</text>
  <!-- Ask GIGI -->
  <rect x="1360" y="860" width="148" height="44" rx="22" fill="rgba(10,10,20,0.9)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <circle cx="1384" cy="882" r="6" fill="#00C46A"/>
  <text x="1402" y="887" font-size="13" fill="white">Ask GIGI</text>
