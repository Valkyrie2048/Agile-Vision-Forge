  <text x="106" y="84" font-size="14" font-weight="700" fill="rgba(255,255,255,0.82)">GIGAMATIC AI</text>
  <text x="106" y="102" font-size="11" fill="rgba(95,66,240,0.7)">&#x2022; Active &#xB7; All context</text>
  <text x="440" y="92" font-size="11" fill="rgba(255,255,255,0.22)">&#x22EE;</text>
  <rect x="26" y="128" width="448" height="1" fill="rgba(255,255,255,0.06)"/>
  <!-- Messages -->
  <!-- AI greeting -->
  <rect x="44" y="148" width="300" height="64" rx="10" fill="rgba(95,66,240,0.1)" stroke="rgba(95,66,240,0.2)" stroke-width="1"/>
  <text x="62" y="170" font-size="12" fill="rgba(255,255,255,0.65)">Hello, Alex. Your cross-platform</text>
  <text x="62" y="188" font-size="12" fill="rgba(255,255,255,0.65)">context is active across Finance,</text>
  <text x="62" y="204" font-size="12" fill="rgba(255,255,255,0.65)">Insure, and Careers.</text>
  <!-- User message 1 -->
  <rect x="192" y="230" width="240" height="44" rx="10" fill="rgba(95,66,240,0.22)" stroke="rgba(95,66,240,0.35)" stroke-width="1"/>
  <text x="212" y="248" font-size="12" fill="rgba(255,255,255,0.82)">Am I ready to apply for</text>
  <text x="212" y="264" font-size="12" fill="rgba(255,255,255,0.82)">a mortgage?</text>
  <!-- AI response 1 -->
