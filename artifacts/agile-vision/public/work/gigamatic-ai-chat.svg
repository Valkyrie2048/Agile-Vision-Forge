  <rect x="44" y="650" width="100" height="36" rx="10" fill="rgba(95,66,240,0.08)" stroke="rgba(95,66,240,0.15)" stroke-width="1"/>
  <circle cx="70" cy="668" r="5" fill="#5F42F0" opacity="0.6"/>
  <circle cx="88" cy="668" r="5" fill="#5F42F0" opacity="0.4"/>
  <circle cx="106" cy="668" r="5" fill="#5F42F0" opacity="0.25"/>
