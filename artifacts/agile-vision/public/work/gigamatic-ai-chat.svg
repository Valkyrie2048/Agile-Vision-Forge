  <rect x="36" y="742" width="408" height="44" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="56" y="768" font-size="12" fill="rgba(255,255,255,0.2)">Ask anything...</text>
  <circle cx="428" cy="764" r="14" fill="#5F42F0" opacity="0.7"/>
