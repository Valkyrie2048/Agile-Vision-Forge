  <text x="62" y="316" font-size="12" font-weight="600" fill="rgba(255,255,255,0.72)">Based on your full picture:</text>
  <text x="62" y="340" font-size="11" fill="rgba(255,255,255,0.52)">&#x2022; Income readiness: 74/100 &#x2713;</text>
  <text x="62" y="358" font-size="11" fill="rgba(255,255,255,0.52)">&#x2022; 3 lenders match your profile &#x2713;</text>
  <text x="62" y="376" font-size="11" fill="rgba(255,200,50,0.7)">&#x2022; Coverage gap may affect score</text>
  <text x="62" y="394" font-size="11" fill="rgba(255,255,255,0.52)">&#x2022; Credit history: strong &#x2713;</text>
  <text x="62" y="412" font-size="11" fill="#5F42F0" opacity="0.75">View full readiness breakdown &#x2192;</text>
  <!-- User message 2 -->
  <rect x="192" y="440" width="240" height="28" rx="8" fill="rgba(95,66,240,0.22)" stroke="rgba(95,66,240,0.35)" stroke-width="1"/>
  <text x="212" y="458" font-size="12" fill="rgba(255,255,255,0.82)">What&#x2019;s the coverage gap?</text>
  <!-- AI response 2 -->
  <rect x="44" y="486" width="340" height="100" rx="10" fill="rgba(95,66,240,0.08)" stroke="rgba(95,66,240,0.16)" stroke-width="1"/>
  <text x="62" y="508" font-size="12" fill="rgba(255,255,255,0.65)">Your Insure profile shows no income</text>
  <text x="62" y="526" font-size="12" fill="rgba(255,255,255,0.65)">protection coverage. Some lenders</text>
  <text x="62" y="544" font-size="12" fill="rgba(255,255,255,0.65)">factor this into risk scoring.</text>
  <rect x="62" y="556" width="152" height="24" rx="6" fill="rgba(95,66,240,0.18)" stroke="rgba(95,66,240,0.3)" stroke-width="1"/>
  <text x="138" y="572" font-size="11" fill="#5F42F0" text-anchor="middle">View in Insure &#x2192;</text>
  <!-- User message 3 -->
  <rect x="192" y="604" width="240" height="28" rx="8" fill="rgba(95,66,240,0.22)" stroke="rgba(95,66,240,0.35)" stroke-width="1"/>
  <text x="212" y="622" font-size="12" fill="rgba(255,255,255,0.82)">Which lenders match me?</text>
