  <text x="530" y="381" font-size="9" fill="#00C46A" text-anchor="middle">Freemium</text>
  <rect x="802" y="370" width="82" height="22" rx="6" fill="rgba(124,58,237,0.2)" stroke="rgba(124,58,237,0.35)" stroke-width="1"/>
  <text x="843" y="385" font-size="11" fill="#A78BFA" text-anchor="middle">View Tool →</text>
  <text x="474" y="422" font-size="14" fill="rgba(255,255,255,0.75)">Claude's 200,000 token context window means it can</text>
  <text x="474" y="444" font-size="14" fill="rgba(255,255,255,0.75)">hold and reason over very long documents without losing</text>
  <text x="474" y="466" font-size="14" fill="rgba(255,255,255,0.75)">coherence — a key advantage for editorial work.</text>
  <text x="474" y="492" font-size="14" fill="rgba(255,255,255,0.6)">ChatGPT is also strong here, especially with custom GPTs...</text>
