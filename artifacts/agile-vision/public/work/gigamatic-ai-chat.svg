  <text x="474" y="228" font-size="14" font-weight="600" fill="url(#ptxt2)">GIGI</text>
  <text x="474" y="256" font-size="14" fill="rgba(255,255,255,0.75)">For long-form writing with real nuance, I'd recommend</text>
  <text x="474" y="278" font-size="14" fill="rgba(255,255,255,0.75)">Claude (by Anthropic) as your primary tool. Here's why:</text>
