  <rect x="44" y="700" width="412" height="24" rx="6" fill="rgba(95,66,240,0.06)"/>
  <text x="62" y="716" font-size="10" fill="#5F42F0" opacity="0.55">Reading Finance &#xB7; Insure &#xB7; Careers context...</text>
