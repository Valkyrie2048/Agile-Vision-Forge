  <rect x="26" y="804" width="448" height="30" rx="0" fill="rgba(6,5,16,0.9)"/>
  <text x="250" y="824" font-size="10" fill="rgba(255,255,255,0.12)" text-anchor="middle">GIGAMATIC AI &#xB7; Consent-first intelligence</text>
