<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="system-ui,-apple-system,sans-serif">
  <!-- Insure homepage - dark, quote widget prominent -->
  <rect width="1600" height="900" fill="#0A0A0A"/>
  <rect width="1600" height="58" fill="rgba(14,14,14,0.97)"/>
