  <text x="114" y="137" font-size="12" fill="rgba(255,255,255,0.55)">40+ Carriers · Independent Platform</text>
  <text x="80" y="232" font-size="78" font-weight="800" fill="white" letter-spacing="-2.5">Insurance,</text>
