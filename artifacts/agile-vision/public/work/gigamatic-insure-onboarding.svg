  <text x="80" y="384" font-size="16" fill="rgba(255,255,255,0.5)">Compare quotes from 40+ top-rated insurers in under 5 minutes.</text>
  <text x="80" y="406" font-size="16" fill="rgba(255,255,255,0.5)">No paperwork. No hassle. Just better rates.</text>
  <rect x="80" y="440" width="200" height="46" rx="8" fill="#00C46A"/>
  <text x="180" y="469" font-size="14" font-weight="700" fill="#040A06" text-anchor="middle">Get Free Quotes →</text>
