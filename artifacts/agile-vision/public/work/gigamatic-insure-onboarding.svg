  <text x="80" y="544" font-size="28" font-weight="800" fill="white">40+</text>
  <text x="80" y="564" font-size="10" fill="rgba(255,255,255,0.3)" letter-spacing="1.5">TOP INSURERS</text>
  <text x="220" y="544" font-size="28" font-weight="800" fill="white">2M+</text>
  <text x="220" y="564" font-size="10" fill="rgba(255,255,255,0.3)" letter-spacing="1.5">QUOTES COMPARED</text>
