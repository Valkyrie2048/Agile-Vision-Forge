  <text x="358" y="36" font-size="13" fill="rgba(255,255,255,0.38)">My Policies</text>
  <text x="456" y="36" font-size="13" fill="rgba(255,255,255,0.38)">Learning Hub</text>
  <text x="558" y="36" font-size="13" fill="rgba(255,255,255,0.38)">Tools</text>
