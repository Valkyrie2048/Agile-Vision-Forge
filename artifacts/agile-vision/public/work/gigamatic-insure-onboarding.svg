  <rect x="1090" y="582" width="86" height="30" rx="15" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="1133" y="602" font-size="12" fill="rgba(255,255,255,0.4)" text-anchor="middle">Health</text>
  <rect x="1186" y="582" width="100" height="30" rx="15" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="1236" y="602" font-size="12" fill="rgba(255,255,255,0.4)" text-anchor="middle">Business</text>
  <rect x="1296" y="582" width="96" height="30" rx="15" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="1344" y="602" font-size="12" fill="rgba(255,255,255,0.4)" text-anchor="middle">Renters</text>
  <!-- Carrier logos -->
  <text x="808" y="650" font-size="10" fill="rgba(255,255,255,0.2)" letter-spacing="1.5">PARTNER CARRIERS</text>
  <rect x="808" y="662" width="100" height="40" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="858" y="686" font-size="10" fill="rgba(255,255,255,0.25)" text-anchor="middle">Allstate</text>
  <rect x="920" y="662" width="100" height="40" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="970" y="686" font-size="10" fill="rgba(255,255,255,0.25)" text-anchor="middle">GEICO</text>
  <rect x="1032" y="662" width="100" height="40" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="1082" y="686" font-size="10" fill="rgba(255,255,255,0.25)" text-anchor="middle">State Farm</text>
  <rect x="1144" y="662" width="100" height="40" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="1194" y="686" font-size="10" fill="rgba(255,255,255,0.25)" text-anchor="middle">Progressive</text>
  <rect x="1256" y="662" width="100" height="40" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="1306" y="686" font-size="10" fill="rgba(255,255,255,0.25)" text-anchor="middle">Nationwide</text>
  <text x="808" y="736" font-size="11" fill="rgba(255,255,255,0.18)" text-anchor="middle">+ 35 more carriers</text>
  <!-- Ask GIGI -->
  <rect x="1360" y="822" width="148" height="44" rx="22" fill="#111" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="1384" cy="844" r="6" fill="#00C46A"/>
  <text x="1402" y="849" font-size="13" fill="white">Ask GIGI</text>
