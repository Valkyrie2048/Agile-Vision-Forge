  <rect x="908" y="582" width="90" height="30" rx="15" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="953" y="602" font-size="12" fill="rgba(255,255,255,0.4)" text-anchor="middle">Home</text>
  <rect x="1008" y="582" width="72" height="30" rx="15" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
