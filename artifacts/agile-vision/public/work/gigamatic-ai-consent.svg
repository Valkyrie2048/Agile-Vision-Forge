  <text x="98" y="344" font-size="13" font-weight="600" fill="rgba(255,255,255,0.75)">GIGAMATIC Insure</text>
  <text x="98" y="362" font-size="11" fill="rgba(255,255,255,0.28)">Coverage profile, eligibility score, coverage gaps</text>
  <text x="98" y="378" font-size="11" fill="rgba(255,255,255,0.18)">Last read: today at 09:34</text>
  <rect x="656" y="340" width="56" height="28" rx="14" fill="#22C38D" opacity="0.8"/>
  <circle cx="698" cy="354" r="12" fill="white"/>
  <text x="716" y="358" font-size="12" fill="#22C38D" font-weight="600">On</text>
