  <text x="40" y="75" font-size="15" font-weight="800" fill="#5F42F0" font-style="italic">GIGAMATIC</text>
  <text x="40" y="91" font-size="9" fill="rgba(255,255,255,0.28)" letter-spacing="2.5">AI</text>
  <text x="190" y="80" font-size="12" fill="rgba(255,255,255,0.35)">Intelligence Hub</text>
  <rect x="280" y="62" width="88" height="26" rx="6" fill="rgba(95,66,240,0.12)"/>
  <text x="324" y="79" font-size="12" fill="#5F42F0" text-anchor="middle">Permissions</text>
  <text x="428" y="80" font-size="12" fill="rgba(255,255,255,0.35)">History</text>
  <!-- Header -->
  <text x="40" y="134" font-size="18" font-weight="700" fill="rgba(255,255,255,0.82)">AI Consent &#38; Memory Controls</text>
  <text x="40" y="154" font-size="12" fill="rgba(255,255,255,0.28)">You control what GIGAMATIC AI can see, remember, and do on your behalf.</text>
  <!-- Context permissions -->
  <text x="40" y="190" font-size="13" font-weight="600" fill="rgba(255,255,255,0.58)">Product Context Permissions</text>
  <text x="40" y="208" font-size="11" fill="rgba(255,255,255,0.22)">GIGAMATIC AI can only read data from products you explicitly allow.</text>
  <!-- Finance permission row -->
  <rect x="40" y="220" width="740" height="80" rx="10" fill="#0d0b1e" stroke="rgba(43,140,238,0.2)" stroke-width="1"/>
  <circle cx="66" cy="260" r="18" fill="rgba(43,140,238,0.15)"/>
  <text x="66" y="265" font-size="11" fill="#2B8CEE" text-anchor="middle">F</text>
  <text x="98" y="252" font-size="13" font-weight="600" fill="rgba(255,255,255,0.78)">GIGAMATIC Finance</text>
  <text x="98" y="270" font-size="11" fill="rgba(255,255,255,0.3)">Income history, readiness score, connected sources, products</text>
  <text x="98" y="286" font-size="11" fill="rgba(255,255,255,0.2)">Last read: today at 09:34</text>
