  <text x="830" y="216" font-size="13" font-weight="600" fill="rgba(255,255,255,0.58)">AI Action Log</text>
  <text x="830" y="234" font-size="11" fill="rgba(255,255,255,0.22)">What GIGAMATIC AI has done</text>
  <!-- Log items -->
  <rect x="830" y="248" width="310" height="56" rx="8" fill="rgba(34,195,141,0.05)" stroke="rgba(34,195,141,0.12)" stroke-width="1"/>
  <text x="846" y="268" font-size="11" font-weight="600" fill="rgba(255,255,255,0.62)">Read Finance context</text>
  <text x="846" y="284" font-size="10" fill="rgba(255,255,255,0.25)">Generated readiness analysis</text>
  <text x="1118" y="268" font-size="10" fill="rgba(255,255,255,0.2)" text-anchor="end">09:34</text>
  <rect x="830" y="312" width="310" height="56" rx="8" fill="rgba(34,195,141,0.04)" stroke="rgba(34,195,141,0.09)" stroke-width="1"/>
  <text x="846" y="332" font-size="11" font-weight="600" fill="rgba(255,255,255,0.55)">Read Insure context</text>
  <text x="846" y="348" font-size="10" fill="rgba(255,255,255,0.22)">Identified coverage gap</text>
  <text x="1118" y="332" font-size="10" fill="rgba(255,255,255,0.18)" text-anchor="end">09:34</text>
  <rect x="830" y="376" width="310" height="56" rx="8" fill="rgba(95,66,240,0.04)" stroke="rgba(95,66,240,0.1)" stroke-width="1"/>
  <text x="846" y="396" font-size="11" font-weight="600" fill="rgba(255,255,255,0.48)">Generated recommendation</text>
  <text x="846" y="412" font-size="10" fill="rgba(255,255,255,0.2)">Priority 1: add income protection</text>
  <text x="1118" y="396" font-size="10" fill="rgba(255,255,255,0.16)" text-anchor="end">09:35</text>
  <text x="830" y="460" font-size="11" fill="rgba(255,255,255,0.2)">Actions requiring confirmation:</text>
  <rect x="830" y="472" width="310" height="48" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="846" y="494" font-size="11" fill="rgba(255,255,255,0.3)">None pending</text>
  <text x="846" y="510" font-size="10" fill="rgba(255,255,255,0.16)">AI never acts without your approval</text>
  <!-- Revoke all -->
  <rect x="830" y="536" width="310" height="36" rx="8" fill="rgba(255,80,80,0.06)" stroke="rgba(255,80,80,0.16)" stroke-width="1"/>
  <text x="985" y="558" font-size="12" fill="rgba(255,100,100,0.6)" text-anchor="middle">Revoke all permissions</text>
  <!-- Bottom reset -->
  <rect x="40" y="682" width="356" height="44" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="218" y="708" font-size="12" fill="rgba(255,255,255,0.28)" text-anchor="middle">Reset all memory &#38; permissions</text>
  <rect x="404" y="682" width="376" height="44" rx="8" fill="rgba(95,66,240,0.08)" stroke="rgba(95,66,240,0.2)" stroke-width="1"/>
  <text x="592" y="708" font-size="12" fill="#5F42F0" text-anchor="middle">Download my AI data</text>
