<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="52%"><stop offset="0%" stop-color="#5F42F0" stop-opacity="0.1"/><stop offset="100%" stop-color="#5F42F0" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="780" fill="#060510"/>
  <rect width="1200" height="780" fill="url(#bg)"/>
  <!-- Browser chrome -->
