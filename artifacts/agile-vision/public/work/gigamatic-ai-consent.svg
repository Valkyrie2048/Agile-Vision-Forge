  <text x="40" y="536" font-size="11" fill="rgba(255,255,255,0.2)">GIGAMATIC AI remembers the following context from your conversations.</text>
  <rect x="40" y="548" width="740" height="56" rx="8" fill="rgba(95,66,240,0.05)" stroke="rgba(95,66,240,0.12)" stroke-width="1"/>
  <text x="60" y="572" font-size="11" fill="rgba(255,255,255,0.48)">&#x2022; You are exploring mortgage eligibility &#xB7; stored July 2026</text>
  <text x="60" y="590" font-size="11" fill="rgba(255,255,255,0.38)">&#x2022; Income protection is a priority action &#xB7; stored July 2026</text>
  <rect x="40" y="614" width="740" height="48" rx="8" fill="rgba(95,66,240,0.04)" stroke="rgba(95,66,240,0.1)" stroke-width="1"/>
  <text x="60" y="638" font-size="11" fill="rgba(255,255,255,0.38)">&#x2022; Career goal: principal designer pathway &#xB7; stored July 2026</text>
  <rect x="660" y="620" width="100" height="28" rx="6" fill="rgba(255,80,80,0.08)" stroke="rgba(255,80,80,0.2)" stroke-width="1"/>
  <text x="710" y="638" font-size="11" fill="rgba(255,100,100,0.65)" text-anchor="middle">Forget this</text>
  <!-- Right: actions log -->
