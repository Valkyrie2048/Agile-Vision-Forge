  <text x="98" y="436" font-size="13" font-weight="600" fill="rgba(255,255,255,0.72)">GIGAMATIC Careers</text>
  <text x="98" y="454" font-size="11" fill="rgba(255,255,255,0.26)">Skill profile, work history, opportunity matches</text>
  <text x="98" y="470" font-size="11" fill="rgba(255,255,255,0.18)">Last read: today at 09:34</text>
  <rect x="656" y="432" width="56" height="28" rx="14" fill="#22C38D" opacity="0.8"/>
  <circle cx="698" cy="446" r="12" fill="white"/>
  <text x="716" y="450" font-size="12" fill="#22C38D" font-weight="600">On</text>
