  <rect x="656" y="248" width="56" height="28" rx="14" fill="#22C38D" opacity="0.8"/>
  <circle cx="698" cy="262" r="12" fill="white"/>
  <text x="716" y="266" font-size="12" fill="#22C38D" font-weight="600">On</text>
